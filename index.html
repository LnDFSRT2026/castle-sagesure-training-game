<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SageSure LND-30688 - Interactive Castle Training Game</title>
    <style>
        :root {
            --primary: #123c69;
            --primary-light: #1f568f;
            --secondary: #00b4d8;
            --accent: #ffb703;
            --background: #0b132b;
            --surface: #1c2541;
            --surface-card: #27354f;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
            --blueprint-cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #0b132b, var(--primary));
            border-bottom: 2px solid var(--blueprint-cyan);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            font-size: 2rem;
            background: rgba(56, 189, 248, 0.15);
            border: 2px solid var(--blueprint-cyan);
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-text h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .header-text p {
            font-size: 0.82rem;
            color: var(--blueprint-cyan);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--secondary);
            color: #0b132b;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
            box-shadow: 0 4px 12px rgba(0, 180, 216, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.3);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.2);
            border-color: white;
        }

        .btn-accent {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #0b132b;
        }

        /* Top Bar with Live QR and Share Details */
        .live-join-bar {
            background: linear-gradient(90deg, #1c2541, #172554);
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .join-info-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .room-pin-badge {
            background: #0b132b;
            color: var(--accent);
            border: 2px dashed var(--blueprint-cyan);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
        }

        /* Main 2-Column Responsive Layout */
        .app-layout {
            max-width: 1440px;
            width: 100%;
            margin: 18px auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 22px;
            flex-grow: 1;
        }

        @media (max-width: 1040px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Left Side: Study & Interactive Controls */
        .study-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .day-nav {
            display: flex;
            background: var(--surface);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
            gap: 6px;
        }

        .day-tab {
            padding: 10px 16px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .day-tab.active {
            background: var(--primary-light);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(0, 180, 216, 0.4);
        }

        .day-tab:hover:not(.active) {
            background: rgba(255,255,255,0.06);
            color: #ffffff;
        }

        .day-panel {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .day-panel.active {
            display: flex;
        }

        .intro-banner {
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.95), rgba(23, 37, 84, 0.85));
            border-left: 5px solid var(--secondary);
            border-radius: 0 12px 12px 0;
            padding: 14px 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            color: #e2e8f0;
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            border-right: 1px solid rgba(255,255,255,0.08);
        }

        /* Flashcards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .flashcard {
            background: var(--surface);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
        }

        .flashcard:hover {
            border-color: var(--blueprint-cyan);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .card-tag {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-unlock-target {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--blueprint-cyan);
        }

        .card-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 14px;
        }

        .card-q {
            font-size: 1.02rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.45;
        }

        .card-a {
            display: none;
            background: rgba(11, 19, 43, 0.9);
            border-left: 3.5px solid var(--success);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.45;
            margin-top: 10px;
        }

        .card-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-card-action {
            flex: 1;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 800;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-reveal {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.3);
        }

        .btn-reveal:hover {
            background: rgba(255,255,255,0.22);
            border-color: white;
        }

        .btn-master {
            background: var(--success);
            color: #0b132b;
        }

        .btn-master:hover:not(:disabled) {
            filter: brightness(1.15);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
        }

        .btn-master:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: default;
        }

        /* Quiz Box */
        .quiz-card {
            background: var(--surface);
            border: 2.5px solid rgba(255, 183, 3, 0.4);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .quiz-header h3 {
            color: var(--accent);
            font-size: 1.15rem;
            font-weight: 800;
        }

        .quiz-badge {
            background: rgba(255, 183, 3, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .quiz-scenario {
            font-size: 0.85rem;
            color: var(--blueprint-cyan);
            margin-bottom: 8px;
            font-style: italic;
        }

        .quiz-question-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: white;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        .quiz-options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            background: rgba(11, 19, 43, 0.7);
            border: 1.5px solid rgba(255,255,255,0.18);
            border-radius: 10px;
            padding: 13px 18px;
            text-align: left;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-option:hover:not(:disabled) {
            border-color: var(--blueprint-cyan);
            background: rgba(56, 189, 248, 0.15);
            transform: translateX(4px);
        }

        .quiz-option.correct {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: var(--success) !important;
            color: #6ee7b7 !important;
            font-weight: 800;
        }

        .quiz-option.incorrect {
            background: rgba(239, 68, 68, 0.25) !important;
            border-color: var(--error) !important;
            color: #fca5a5 !important;
        }

        .quiz-feedback {
            display: none;
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .quiz-feedback.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border-left: 4px solid var(--success);
            color: #6ee7b7;
        }

        .quiz-feedback.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border-left: 4px solid var(--error);
            color: #fca5a5;
        }

        /* Right Side: Visual Castle Canvas & Stats */
        .castle-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .castle-card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .castle-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .castle-card-header h2 {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BLUEPRINT CASTLE VIEWPORT */
        .castle-viewport {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #0b132b;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 12px;
            border: 2px solid var(--blueprint-cyan);
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.85), 0 0 20px rgba(56, 189, 248, 0.25);
            perspective: 800px;
        }

        .castle-ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to top, #14532d, #166534);
            border-top: 2px solid #22c55e;
            z-index: 10;
        }

        /* VISIBLE BLUEPRINT WIREFRAME PIECES */
        .castle-piece {
            position: absolute;
            border: 2px dashed rgba(56, 189, 248, 0.75);
            background: rgba(56, 189, 248, 0.08);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(56, 189, 248, 0.85);
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            overflow: hidden;
        }

        /* Color fills when unlocked */
        .castle-piece.unlocked {
            border: 2.5px solid #0f172a;
            color: transparent;
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }

        /* Day 1 */
        #piece-foundation {
            bottom: 30px;
            left: 15%;
            width: 70%;
            height: 25px;
            border-radius: 4px;
            z-index: 11;
        }
        #piece-foundation.unlocked {
            background: linear-gradient(135deg, #7c2d12, #c2410c);
        }

        #piece-courtyard {
            bottom: 55px;
            left: 20%;
            width: 60%;
            height: 75px;
            z-index: 12;
        }
        #piece-courtyard.unlocked {
            background: linear-gradient(to right, #fef08a, #fde047);
        }

        #piece-gatehouse {
            bottom: 55px;
            left: 41%;
            width: 18%;
            height: 85px;
            z-index: 14;
            border-radius: 4px 4px 0 0;
        }
        #piece-gatehouse.unlocked {
            background: linear-gradient(to bottom, #9a3412, #c2410c);
        }

        /* Day 2 */
        #piece-left-wall {
            bottom: 55px;
            left: 9%;
            width: 11%;
            height: 65px;
            z-index: 13;
        }
        #piece-left-wall.unlocked {
            background: linear-gradient(135deg, #64748b, #475569);
        }

        #piece-right-wall {
            bottom: 55px;
            right: 9%;
            width: 11%;
            height: 65px;
            z-index: 13;
        }
        #piece-right-wall.unlocked {
            background: linear-gradient(135deg, #64748b, #475569);
        }

        #piece-drawbridge {
            bottom: 30px;
            left: 44%;
            width: 12%;
            height: 38px;
            border-radius: 4px 4px 0 0;
            z-index: 16;
            transform-origin: bottom center;
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #piece-drawbridge.unlocked {
            background-color: #854d0e;
            border-color: #451a03;
        }
        #piece-drawbridge.let-down {
            transform: rotateX(75deg) scaleY(1.35) !important;
            background-color: #451a03 !important;
            box-shadow: 0 15px 30px rgba(0,0,0,0.85) !important;
            z-index: 25 !important;
        }

        /* Day 3 */
        #piece-left-tower {
            bottom: 55px;
            left: 0%;
            width: 9%;
            height: 155px;
            z-index: 13;
        }
        #piece-left-tower.unlocked {
            background: linear-gradient(to bottom, #1e40af, #1d4ed8);
        }

        #piece-right-tower {
            bottom: 55px;
            right: 0%;
            width: 9%;
            height: 155px;
            z-index: 13;
        }
        #piece-right-tower.unlocked {
            background: linear-gradient(to bottom, #1e40af, #1d4ed8);
        }

        #piece-portcullis {
            bottom: 55px;
            left: 45%;
            width: 10%;
            height: 42px;
            z-index: 15;
        }
        #piece-portcullis.unlocked {
            background: repeating-linear-gradient(90deg, #334155, #334155 3px, transparent 3px, transparent 8px);
            border-color: #1e293b;
        }

        /* Day 4 */
        #piece-keep-wall {
            bottom: 130px;
            left: 28%;
            width: 44%;
            height: 75px;
            z-index: 12;
        }
        #piece-keep-wall.unlocked {
            background: linear-gradient(135deg, #f8fafc, #cbd5e1);
        }

        #piece-main-hall {
            bottom: 130px;
            left: 33%;
            width: 34%;
            height: 55px;
            z-index: 13;
        }
        #piece-main-hall.unlocked {
            background: linear-gradient(to top, #fbbf24, #f59e0b);
        }

        #piece-turret {
            bottom: 205px;
            left: 41%;
            width: 18%;
            height: 55px;
            z-index: 13;
        }
        #piece-turret.unlocked {
            background: linear-gradient(to bottom, #6b21a8, #7c3aed);
        }

        /* Day 5 */
        #piece-flags {
            bottom: 260px;
            left: 49%;
            width: 6px;
            height: 38px;
            z-index: 17;
            border: 1px solid var(--blueprint-cyan);
        }
        #piece-flags.unlocked {
            background-color: #10b981;
            border: none;
        }
        #piece-flags.unlocked::after {
            content: '';
            position: absolute;
            top: 0;
            left: 6px;
            width: 18px;
            height: 12px;
            background-color: #fbbf24;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        #piece-moat {
            bottom: 0;
            left: 4%;
            width: 92%;
            height: 18px;
            border-radius: 10px 10px 0 0;
            z-index: 20;
        }
        #piece-moat.unlocked {
            background: linear-gradient(to bottom, #00f0ff, #0891b2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
            border-color: #0891b2;
        }

        #piece-crown {
            bottom: 285px;
            left: 45%;
            width: 10%;
            height: 20px;
            border-radius: 50% 50% 0 0;
            z-index: 18;
        }
        #piece-crown.unlocked {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border: 2px solid #b45309;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.9);
        }

        /* St
