<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SageSure LND-30688 - Interactive Castle Training Game</title>
    <style>
        :root {
            --primary: #123c69;
            --primary-light: #1f568f;
            --secondary: #00b4d8;
            --accent: #ffb703;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-card: #27354f;
            --card-front-bg: #162c46;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
            --blueprint-cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #0f172a, var(--primary));
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 1.8rem;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--blueprint-cyan);
            border-radius: 10px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--blueprint-cyan);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--secondary);
            color: #0f172a;
            border: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.25);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.18);
            border-color: white;
        }

        .btn-accent {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #0f172a;
            font-weight: 800;
        }

        /* Banner for Direct Sharing */
        .share-banner {
            background: linear-gradient(90deg, #1e293b, #172554);
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.88rem;
        }

        .share-banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .pin-pill {
            background: #0f172a;
            color: var(--accent);
            border: 1.5px dashed var(--blueprint-cyan);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* Main 2-Column Responsive Layout */
        .app-container {
            max-width: 1440px;
            width: 100%;
            margin: 15px auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        @media (max-width: 1040px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }

        /* Left Side: Study & Interactive Controls */
        .study-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .day-nav {
            display: flex;
            background: var(--surface);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
            gap: 6px;
        }

        .day-tab {
            padding: 10px 14px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .day-tab.active {
            background: var(--primary-light);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(0, 180, 216, 0.3);
        }

        .day-tab:hover:not(.active) {
            background: rgba(255,255,255,0.05);
            color: #ffffff;
        }

        .day-content {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .day-content.active {
            display: flex;
        }

        .intro-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(23, 37, 84, 0.8));
            border-left: 4px solid var(--secondary);
            border-radius: 0 10px 10px 0;
            padding: 14px 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            color: #e2e8f0;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        /* Flashcards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .card-card {
            background: var(--surface);
            border: 2px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
        }

        .card-card:hover {
            border-color: var(--blueprint-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .card-tag {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 12px;
        }

        .card-question {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
        }

        .card-answer {
            display: none;
            background: rgba(15, 23, 42, 0.8);
            border-left: 3px solid var(--success);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-top: 10px;
        }

        .card-footer-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-card {
            flex: 1;
            padding: 9px 12px;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-reveal {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .btn-reveal:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-master {
            background: var(--success);
            color: #0f172a;
            font-weight: 800;
        }

        .btn-master:hover:not(:disabled) {
            filter: brightness(1.15);
        }

        .btn-master:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: default;
        }

        /* Quiz Box */
        .quiz-box {
            background: var(--surface);
            border: 2px solid rgba(255, 183, 3, 0.3);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }

        .quiz-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .quiz-title-bar h3 {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .quiz-unlock-badge {
            background: rgba(255, 183, 3, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .quiz-scenario-text {
            font-size: 0.84rem;
            color: var(--blueprint-cyan);
            margin-bottom: 8px;
            font-style: italic;
        }

        .quiz-q-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .quiz-options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-opt-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: left;
            color: white;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-opt-btn:hover:not(:disabled) {
            border-color: var(--blueprint-cyan);
            background: rgba(56, 189, 248, 0.12);
            transform: translateX(4px);
        }

        .quiz-opt-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--success) !important;
            color: #6ee7b7 !important;
            font-weight: bold;
        }

        .quiz-opt-btn.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--error) !important;
            color: #fca5a5 !important;
        }

        .quiz-feedback-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .quiz-feedback-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border-left: 4px solid var(--success);
            color: #6ee7b7;
        }

        .quiz-feedback-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border-left: 4px solid var(--error);
            color: #fca5a5;
        }

        /* Right Side: Visual Castle Canvas & Stats */
        .castle-panel {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            height: fit-content;
        }

        .castle-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .castle-panel-header h2 {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BLUEPRINT CASTLE CONTAINER */
        .castle-viewport {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #0b132b;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 12px;
            border: 2px solid var(--blueprint-cyan);
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 15px rgba(56, 189, 248, 0.2);
            perspective: 800px;
        }

        .castle-ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to top, #14532d, #166534);
            border-top: 2px solid #22c55e;
            z-index: 10;
        }

        /* VISIBLE BLUEPRINT WIREFRAME PIECES */
        .castle-piece {
            position: absolute;
            border: 2px dashed rgba(56, 189, 248, 0.7);
            background: rgba(56, 189, 248, 0.06);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.15);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(56, 189, 248, 0.6);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            overflow: hidden;
        }

        .castle-piece.unlocked {
            border: 2.5px solid #0f172a;
            color: transparent;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Day 1 */
        #piece-foundation {
            bottom: 30px;
            left: 15%;
            width: 70%;
            height: 25px;
            border-radius: 4px;
            z-index: 11;
        }
        #piece-foundation.unlocked {
            background: linear-gradient(135deg, #7c2d12, #c2410c);
        }

        #piece-courtyard {
            bottom: 55px;
            left: 20%;
            width: 60%;
            height: 75px;
